name: Windows

# only when asked (Actions > Windows > Run workflow), to save build minutes
on:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Dual HD (x86_64)
    runs-on: windows-2025-vs2026
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
    - name: Check out sources
      uses: actions/checkout@v6
    - name: Restore vcpkg cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-x86_64-windows-${{ hashFiles('vcpkg.json') }}
        restore-keys: vcpkg-x86_64-windows-
    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: Build
      uses: lukka/run-cmake@v10
      with:
        configurePreset: release-windows-x86_64
        configurePresetAdditionalArgs: "['-DENABLE_DEBUG_DEPS=OFF', '-DBUILD_QT_SDL=OFF', '-DBUILD_DUALHD=ON', '-DENABLE_GDBSTUB=OFF']"
        buildPreset: release-windows-x86_64
    - name: Package
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path build\release-windows-x86_64 -Recurse -Filter "Dual HD.exe" | Select-Object -First 1
        Write-Output "exe: $($exe.FullName)"
        Copy-Item $exe.FullName "Dual HD.exe"
    - uses: actions/upload-artifact@v7
      with:
        name: DualHD-Windows
        path: "Dual HD.exe"
    - name: Save vcpkg cache
      uses: actions/cache/save@v4
      with:
        path: ${{ github.workspace }}/vcpkg_cache
        key: vcpkg-x86_64-windows-${{ hashFiles('vcpkg.json') }}
