name: macOS (Apple Silicon)

# started by hand when a version is ready (Actions > macOS > Run workflow), to save build minutes
on:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Dual HD (arm64)
    runs-on: macos-26
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Install dependencies for package building
        run: brew install autoconf automake autoconf-archive libtool python-setuptools
      - name: Set up CMake
        uses: lukka/get-cmake@latest
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-arm64-osx-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-arm64-osx-
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: release-mac-arm64
          buildPreset: release-mac-arm64
          configurePresetAdditionalArgs: "['-DBUILD_QT_SDL=OFF', '-DBUILD_DUALHD=ON', '-DENABLE_GDBSTUB=OFF']"
      - name: Package the app
        shell: bash
        run: |
          APP=$(find build/release-mac-arm64 -maxdepth 3 -name "Dual HD.app" -type d | head -1)
          echo "app: $APP"
          cd "$(dirname "$APP")"
          codesign -s - --deep --force "Dual HD.app"
          ditto -c -k --keepParent "Dual HD.app" "$GITHUB_WORKSPACE/Dual HD for Mac.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: DualHD-Mac
          path: "Dual HD for Mac.zip"
          retention-days: 14
          archive: false
      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-arm64-osx-${{ hashFiles('vcpkg.json') }}
